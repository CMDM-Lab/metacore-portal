# Old MetaCore Joomla portal -> new static site (https://www.cmdm.tw/metacore-portal/)
# Source: CMDM-Lab/metacore-portal deploy/cmdm6-metacore-portal-redirect.conf
# Included from /etc/apache2/sites-available/000-default-le-ssl.conf
# (the :80 vhost already redirects everything to https).
# Generated from src/data/downloads.yaml legacy_id. No PHP is involved.
# Old download ids 1, 2, 3, 5, 6 were removed on 2026-11-20 (files deleted);
# those URLs now fall through to the rules below.

RewriteEngine on

# Downloads: index.php/downloads?task=download&id=N
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=4(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/how-to-apply-metacore.docx [R=301,L,QSD]

# Direct links to the old file storage
RewriteRule ^/metacore_portal/images/simplefilemanager/5488fcf6c1c466\.90370863/ https://www.cmdm.tw/metacore-portal/files/how-to-apply-metacore.docx [R=301,L,QSD]

# Pages (Joomla menu aliases)
RewriteRule ^/metacore_portal/index\.php/metacore-members https://www.cmdm.tw/metacore-portal/members/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/metacore-pricing https://www.cmdm.tw/metacore-portal/pricing/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/metacore-services https://www.cmdm.tw/metacore-portal/apply/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/downloads https://www.cmdm.tw/metacore-portal/downloads/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/faq https://www.cmdm.tw/metacore-portal/faq/ [R=301,L,QSD]

# Everything else (home page, introduction, old query-string URLs)
RewriteRule ^/metacore_portal(/.*)?$ https://www.cmdm.tw/metacore-portal/ [R=301,L,QSD]
