# Old MetaCore Joomla portal -> new static site (https://www.cmdm.tw/metacore-portal/)
# Source: CMDM-Lab/metacore-portal deploy/cmdm6-metacore-portal-redirect.conf
# Included from /etc/apache2/sites-available/000-default-le-ssl.conf
# (the :80 vhost already redirects everything to https).
# Generated from src/data/downloads.yaml legacy_id. No PHP is involved.

RewriteEngine on

# Downloads: index.php/downloads?task=download&id=N
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=1(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/sample-submission-record.docx [R=301,L,QSD]
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=2(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/mapping-table.csv [R=301,L,QSD]
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=3(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/mapping-table-example.xlsx [R=301,L,QSD]
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=4(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/how-to-apply-metacore.docx [R=301,L,QSD]
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=5(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/sample-collection-protocol.pdf [R=301,L,QSD]
RewriteCond %{QUERY_STRING} (^|&)task=download(&|$)
RewriteCond %{QUERY_STRING} (^|&)id=6(&|$)
RewriteRule ^/metacore_portal/ https://www.cmdm.tw/metacore-portal/files/cell-extraction-protocol.pdf [R=301,L,QSD]

# Direct links to the old file storage
RewriteRule ^/metacore_portal/images/simplefilemanager/540ea5e1a39089\.99506490/ https://www.cmdm.tw/metacore-portal/files/sample-submission-record.docx [R=301,L,QSD]
RewriteRule ^/metacore_portal/images/simplefilemanager/540ea646cd99a4\.04731203/ https://www.cmdm.tw/metacore-portal/files/mapping-table.csv [R=301,L,QSD]
RewriteRule ^/metacore_portal/images/simplefilemanager/540ea680089484\.17929395/ https://www.cmdm.tw/metacore-portal/files/mapping-table-example.xlsx [R=301,L,QSD]
RewriteRule ^/metacore_portal/images/simplefilemanager/5488fcf6c1c466\.90370863/ https://www.cmdm.tw/metacore-portal/files/how-to-apply-metacore.docx [R=301,L,QSD]
RewriteRule ^/metacore_portal/images/simplefilemanager/548900a63789e7\.70724124/ https://www.cmdm.tw/metacore-portal/files/sample-collection-protocol.pdf [R=301,L,QSD]
RewriteRule ^/metacore_portal/images/simplefilemanager/54890155df56a4\.19234569/ https://www.cmdm.tw/metacore-portal/files/cell-extraction-protocol.pdf [R=301,L,QSD]

# Pages (Joomla menu aliases)
RewriteRule ^/metacore_portal/index\.php/metacore-members https://www.cmdm.tw/metacore-portal/members/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/metacore-pricing https://www.cmdm.tw/metacore-portal/pricing/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/metacore-services https://www.cmdm.tw/metacore-portal/apply/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/downloads https://www.cmdm.tw/metacore-portal/downloads/ [R=301,L,QSD]
RewriteRule ^/metacore_portal/index\.php/faq https://www.cmdm.tw/metacore-portal/faq/ [R=301,L,QSD]

# Everything else (home page, introduction, old query-string URLs)
RewriteRule ^/metacore_portal(/.*)?$ https://www.cmdm.tw/metacore-portal/ [R=301,L,QSD]
